name: checks
permissions:
  contents: read

# Everything that has to pass before a version is built: called by the
# workflow of develop (every commit, once) and by a manual rebuild of a
# release, and on pull requests into develop (Dependabot). A pull request into
# main has none of its own: its commits are those of develop, already checked,
# and main's branch protection requires those results ("checks / code",
# "checks / e2e" of the commit) before it can be merged.
on:
  pull_request:
    branches-ignore:
      - main
  workflow_call:

jobs:
  # types, lint, formatting, the unit tests of shared, server and client, both builds
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # no install scripts of dependencies: nothing needs them (esbuild ships its binary as
      # a platform package, the test MongoDB is fetched by the tests themselves)
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # the server's tests run against an in-memory MongoDB (mongodb-memory-server)
      - run: npm test
      - run: node --test scripts/version.test.mjs
      - run: npm run openapi -- --check
      - run: npm run build

  # the app in a browser against the real server, MongoDB and Mailpit (e-mail codes)
  e2e:
    runs-on: ubuntu-24.04
    # about twelve minutes when it works: whatever hangs fails here instead of after six hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # Chromium for Playwright, cached per Playwright version
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # the dev stack, as on a developer's machine: MongoDB and Mailpit in Docker
      # (the tests write into the database with `docker compose exec mongo`)
      - name: Environment
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n/+=')|" .env
          # all tests come from one address: the per-address limit would trip in a busy minute
          echo "API_RATE_LIMIT=5000" >> .env
      - run: docker compose up -d --wait mongo mailpit
      - name: Start the app
        run: |
          nohup npm run dev > dev.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:3100/api/health > /dev/null \
              && curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 2
          done
          cat dev.log
          exit 1
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results
            dev.log
          retention-days: 7
