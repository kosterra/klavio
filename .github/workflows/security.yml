name: security
permissions:
  contents: read

# Security scans, apart from the checks (not required by any branch protection):
# secrets in the whole Git history, static analysis of the code, misconfigurations
# and secrets in the files, known vulnerabilities in the production image and in
# the production dependencies. The scanners run as Docker images pinned to exact
# versions (each at least two weeks old when chosen).
on:
  push:
    branches:
      - develop
  # every Monday morning: new advisories also hit code that didn't change
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # secrets anywhere in the Git history (shown redacted)
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # the checkout belongs to another user than the container's: let Git read it anyway
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --no-banner

  # static analysis: JavaScript/TypeScript, Node, React, OWASP Top 10, secrets, Dockerfile, workflows
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          semgrep/semgrep:1.183.0
          semgrep scan --metrics=off --error
          --config p/javascript --config p/typescript --config p/nodejs --config p/react
          --config p/owasp-top-ten --config p/secrets --config p/dockerfile --config p/github-actions
          --exclude node_modules --exclude e2e --exclude test --exclude '*.test.ts' --exclude '*.test.tsx'

  # misconfigurations and secrets in the files; known vulnerabilities in the production image
  trivy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy (files)
        run: >-
          docker run --rm -v "$PWD:/src"
          aquasec/trivy:0.76.1
          fs --scanners misconfig,secret --skip-dirs '**/node_modules'
          --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Build the production image
        run: docker build --target production -t klavio:scan .
      - name: trivy (image)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 klavio:scan

  # known vulnerabilities in what the server runs with (dev tools left out)
  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
