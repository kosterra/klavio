name: klavio

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      # mongod < 8.0.35 refuses to start on Linux 7.x kernels (SERVER-131779).
      # Remove once mongo:8.0 resolves to >= 8.0.35.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo_data:/data/db
    # exposed on localhost only, for `npm run dev`
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Catches all mails (e-mail login codes) — inbox at http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:8026:8025'
      - '127.0.0.1:1026:1025'

  # Klavio: app and API in one image (kosterra/klavio). `docker compose build`
  # builds it locally; KLAVIO_VERSION picks a published version instead.
  app:
    image: kosterra/klavio:${KLAVIO_VERSION:-latest}
    build: { context: ., target: production }
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/klavio
      # The origin the browser sees; set PUBLIC_ORIGIN when it differs (e.g. behind another proxy).
      APP_ORIGIN: ${PUBLIC_ORIGIN:-https://${SITE_ADDRESS:-localhost}:${HTTPS_PORT:-8443}}
      RP_ID: ${SITE_ADDRESS:-localhost}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
      # Mail goes to Mailpit unless a real SMTP server is configured (see docs/betrieb.md).
      SMTP_HOST: ${SMTP_HOST_DOCKER:-mailpit}
      SMTP_PORT: ${SMTP_PORT_DOCKER:-1025}
    depends_on:
      mongo:
        condition: service_healthy

  # TLS (Let's Encrypt or a local CA) in front of the app
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  mongo_data:
  caddy_data:
