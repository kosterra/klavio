name: klavio

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      # mongod < 8.0.35 refuses to start on Linux 7.x kernels (SERVER-131779).
      # Remove once mongo:8.0 resolves to >= 8.0.35.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo_data:/data/db
    # exposed on localhost only, for `npm run dev`
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Catches all mails (e-mail login codes) — inbox at http://localhost:8026
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:8026:8025'
      - '127.0.0.1:1026:1025'

  server:
    build: { context: ., target: server }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017/klavio
      APP_ORIGIN: https://${SITE_ADDRESS:-localhost}:${HTTPS_PORT:-8443}
      RP_ID: ${SITE_ADDRESS:-localhost}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
      SMTP_HOST: ${SMTP_HOST_DOCKER:-mailpit}
      SMTP_PORT: ${SMTP_PORT_DOCKER:-1025}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - caddy_data:/data
    depends_on:
      - server

volumes:
  mongo_data:
  caddy_data:
